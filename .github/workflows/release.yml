
name: Build Release Packages

on:
  push:
    branches:
      - feature/publishing
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.runtime }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - osx-x64
          - osx-arm64
          - linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test --configuration Release

      # Publish a self-contained executable for each platform.
      - name: Publish application
        run: |
          dotnet publish XPlaneLocalizerFixer/XPlaneLocalizerFixer.csproj \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            --output ./publish/${{ matrix.runtime }}

      # Create the release directory structure.
      - name: Prepare package
        shell: bash
        run: |
          PACKAGE_DIR="./package/XPlaneLocalizerFixer"

          mkdir -p "$PACKAGE_DIR/input"
          mkdir -p "$PACKAGE_DIR/output"

          cp -a ./publish/${{ matrix.runtime }}/. "$PACKAGE_DIR/"
          
          # Remove debugging symbols from the distributed package.
          find "$PACKAGE_DIR" -type f -name '*.pdb' -delete

          cp XPlaneLocalizerFixer/appsettings.json \
            "$PACKAGE_DIR/appsettings.json"

          if [[ "${{ matrix.runtime }}" != win-* ]]; then
            chmod +x "$PACKAGE_DIR/XPlaneLocalizerFixer"
          fi

      - name: Package Windows
        if: startsWith(matrix.runtime, 'win-')
        shell: bash
        run: |
          cd package
          zip -r "../XPlaneLocalizerFixer-${{ matrix.runtime }}.zip" \
            XPlaneLocalizerFixer

      - name: Package macOS and Linux
        if: ${{ !startsWith(matrix.runtime, 'win-') }}
        shell: bash
        run: |
          tar -czf "XPlaneLocalizerFixer-${{ matrix.runtime }}.tar.gz" \
            -C package XPlaneLocalizerFixer

      # Store each package for the release job.
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPlaneLocalizerFixer-${{ matrix.runtime }}
          path: XPlaneLocalizerFixer-${{ matrix.runtime }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest

    # Only create a GitHub Release for version tags.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      # Download all four packages from the publish jobs.
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: XPlaneLocalizerFixer-*
          path: ./dist

      # Publish all archives in one GitHub Release.
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' -t files < <(
            find ./dist -type f \
              \( -name '*.zip' -o -name '*.tar.gz' \) \
              -print0
          )

          if [ "${#files[@]}" -ne 4 ]; then
            echo "Expected four release archives."
            exit 1
          fi

          release_flags=()

          # Versions containing a hyphen are pre-releases.
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$TAG" "${files[@]}" \
            --verify-tag \
            --generate-notes \
            "${release_flags[@]}"
